name: One-off objections finalize

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-objections-20260906.yml
      - scripts/oneoff-20260906-objections.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/oneoff-20260906-objections.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Test backend
        run: npm test

      - name: Install Admin dependencies
        working-directory: admin
        run: npm ci

      - name: Test Admin
        working-directory: admin
        run: npm test

      - name: Build Admin
        working-directory: admin
        run: npm run build

      - name: Check schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Android APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Remove temporary tools
        run: |
          rm -f .github/workflows/oneoff-objections-20260906.yml
          rm -f scripts/oneoff-20260906-objections.py

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(orders): fecha objecoes de reabertura e diagnosticos"
          git push origin HEAD:main
