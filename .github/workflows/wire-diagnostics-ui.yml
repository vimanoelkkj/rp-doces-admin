name: Conectar diagnosticos

on:
  push:
    paths:
      - ".github/workflows/wire-diagnostics-ui.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 scripts/wire-diagnostics-ui.py

      - name: Commitar interfaces conectadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-diagnostics-ui.yml scripts/wire-diagnostics-ui.py
          git add admin/src/store/StorePage.tsx \
            apps/android/app/src/main/java/br/com/rpdoces/admin/data/diagnostics/DiagnosticsRepository.kt \
            apps/android/app/src/main/java/br/com/rpdoces/admin/ui/appcontrol/DiagnosticsPanel.kt \
            apps/android/app/src/main/java/br/com/rpdoces/admin/ui/appcontrol/AppControlScreen.kt
          git commit -m "feat(diagnostics): expoe testes de pix e pedidos"
          git push origin HEAD:main
