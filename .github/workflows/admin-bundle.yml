name: Bundle do Admin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-admin-bundle:
    if: ${{ !contains(github.event.head_commit.message, '[skip admin bundle]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar bundle do Admin
        run: npm run build

      - name: Versionar bundle publicado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A public/admin

          if git diff --cached --quiet; then
            echo "Bundle do Admin já está atualizado."
            exit 0
          fi

          git commit -m "build(admin): atualiza bundle publicado [skip admin bundle]"
          git push origin HEAD:main
