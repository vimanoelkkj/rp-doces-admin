name: One-off paid exchange finalize

# Revalidação final após manter os campos financeiros por item opcionais no Admin.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-paid-exchange-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar chamada Android da correção paga
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/android/app/src/main/java/br/com/rpdoces/admin/ui/orders/OrdersScreen.kt')
          text = path.read_text(encoding='utf-8')
          callback_old = 'onConfirm = { targetItemId ->'
          callback_new = 'onConfirm = { targetItemId, refundMethod, confirmRefund ->'
          call_old = 'repository.reallocateItemPayment(order.id, sourceItemId, targetItemId)'
          call_new = '''repository.reallocateItemPayment(
                                  order.id,
                                  sourceItemId,
                                  targetItemId,
                                  refundMethod,
                                  confirmRefund
                              )'''
          if text.count(callback_old) != 1:
              raise SystemExit(f'Callback esperado não encontrado exatamente uma vez: {text.count(callback_old)}')
          if text.count(call_old) != 1:
              raise SystemExit(f'Chamada esperada não encontrada exatamente uma vez: {text.count(call_old)}')
          text = text.replace(callback_old, callback_new)
          text = text.replace(call_old, call_new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar backend
        run: npm test

      - name: Instalar dependências do Admin
        working-directory: admin
        run: npm ci

      - name: Testar Admin
        working-directory: admin
        run: npm test

      - name: Compilar Admin
        working-directory: admin
        run: npm run build

      - name: Verificar schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar APK debug
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Limpar ferramentas temporárias
        run: |
          rm -f .github/workflows/oneoff-paid-exchange-finalize.yml
          rm -f .github/workflows/oneoff-schema-035.yml
          rm -f .github/workflows/oneoff-focus-timing.yml
          rm -f scripts/oneoff-20260906-focus-timing.py

      - name: Commitar implementação validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "feat(orders): finaliza troca paga com devolucao e estoque"
          git push origin HEAD:main
