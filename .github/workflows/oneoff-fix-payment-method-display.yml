name: One-off payment method display fix

on:
  push:
    branches: [main]
    paths:
      - ".github/patches/oneoff-fix-payment-method-display.py"
      - ".github/workflows/oneoff-fix-payment-method-display.yml"

permissions:
  contents: write

jobs:
  patch-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar patch
        run: python .github/patches/oneoff-fix-payment-method-display.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Testar backend
        run: |
          npm ci
          npm test

      - name: Testar e compilar Admin
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build

      - name: Verificar schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar APK Android
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Limpar ferramentas temporárias e publicar patch
        run: |
          rm .github/patches/oneoff-fix-payment-method-display.py
          rm .github/workflows/oneoff-fix-payment-method-display.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(orders): exibe forma de pagamento confirmada"
          git push origin HEAD:main
