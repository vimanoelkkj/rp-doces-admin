name: One-off fix MP Orders refund

on:
  push:
    branches: [main]
    paths:
      - "scripts/oneoff-fix-mp-orders-refund.py"
      - ".github/workflows/oneoff-fix-mp-orders-refund.yml"

permissions:
  contents: write

jobs:
  patch-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar patch
        run: python3 scripts/oneoff-fix-mp-orders-refund.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Testar backend
        run: |
          npm ci
          npm test

      - name: Testar e compilar Admin
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build

      - name: Verificar schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - name: Limpar temporários e publicar
        run: |
          rm -f scripts/oneoff-fix-mp-orders-refund.py
          rm -f .github/workflows/oneoff-fix-mp-orders-refund.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(orders): usa Orders API no estorno automatico"
          git push origin HEAD:main
