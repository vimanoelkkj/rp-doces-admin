name: Testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Instalar dependências do Admin V2
        working-directory: admin-v2
        run: npm ci

      - name: Executar testes do Admin V2
        working-directory: admin-v2
        run: npm test

      - name: Compilar Admin V2
        working-directory: admin-v2
        run: npm run build

      - name: Verificar drift do schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql
