name: One-off auto MP exchange refund

on:
  push:
    branches: [main]
    paths:
      - "scripts/oneoff-auto-mp-exchange-refund.py"
      - ".github/workflows/oneoff-auto-mp-exchange-refund.yml"

permissions:
  contents: write

jobs:
  patch-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar patch
        run: |
          python3 scripts/oneoff-auto-mp-exchange-refund.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/src/orders/order.schema.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('reembolso_automatico_disponivel: z.coerce.boolean().optional().default(false),', 'reembolso_automatico_disponivel: z.coerce.boolean().optional(),')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Testar backend
        run: |
          npm ci
          npm test

      - name: Testar e compilar Admin
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build

      - name: Verificar schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar APK Android
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Limpar temporários e publicar
        run: |
          rm -f scripts/oneoff-auto-mp-exchange-refund.py
          rm -f .github/workflows/oneoff-auto-mp-exchange-refund.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(orders): estorna diferenca automaticamente no Mercado Pago"
          git push origin HEAD:main
