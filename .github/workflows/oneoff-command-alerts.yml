name: One-off command alerts patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-command-alerts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 scripts/oneoff-20260906-command-alerts.py

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "feat(app): reabre comandas pagas e navega alertas de estoque"
          git push origin HEAD:main
