name: Validar diagnosticos finais

on:
  push:
    paths:
      - ".github/workflows/validate-diagnostics-final.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testar backend
        run: npm test

      - name: Instalar dependencias do Admin
        working-directory: admin
        run: npm ci

      - name: Testar Admin
        working-directory: admin
        run: npm test

      - name: Compilar Admin
        working-directory: admin
        run: npm run build

      - name: Verificar schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar APK Android
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Remover workflow temporario
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-diagnostics-final.yml
          git commit -m "chore(ci): remove validacao temporaria dos diagnosticos"
          git push origin HEAD:main
