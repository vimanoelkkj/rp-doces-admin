name: One-off focus timing patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-focus-timing.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajuste
        run: python3 scripts/oneoff-20260906-focus-timing.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar backend
        run: npm test

      - name: Instalar dependências do Admin
        working-directory: admin
        run: npm ci

      - name: Testar Admin
        working-directory: admin
        run: npm test

      - name: Compilar Admin
        working-directory: admin
        run: npm run build

      - name: Verificar schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar APK debug
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Commitar ajuste validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/src/products/ProductsPage.tsx apps/android/app/src/main/java/br/com/rpdoces/admin/ui/products/ProductsScreen.kt
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix(app): estabiliza foco dos alertas de estoque"
          git push origin HEAD:main
