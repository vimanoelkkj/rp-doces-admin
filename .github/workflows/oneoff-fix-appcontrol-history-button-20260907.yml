name: One-off fix AppControl history button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-fix-appcontrol-history-button-20260907.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir botao Restaurar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/android/app/src/main/java/br/com/rpdoces/admin/ui/appcontrol/AppControlScreen.kt')
          text = path.read_text(encoding='utf-8')
          old = '''@Composable
          private fun HistoryRow(
              item: AppConfigHistoryEntry,
              currentRevision: Int?,
              saving: Boolean,
              onRestore: () -> Unit
          ) {
              val web = LocalRPWebColors.current
              Row(
                  modifier = Modifier.fillMaxWidth().padding(vertical = 3.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Text("#${item.revision}", color = web.accentDark, fontSize = 10.5.sp, fontWeight = FontWeight.Bold, modifier = Modifier.width(40.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(item.updatedByName ?: "Sistema", color = web.text, fontSize = 10.5.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(formatHistoryDate(item.updatedAt), color = web.muted, fontSize = 9.sp)
                  }
                  ActionButton(
                      text = if (item.revision == currentRevision) "Ativa" else "Restaurar",
                      enabled = !saving && item.revision != currentRevision,
                      primary = false,
                      onClick = onRestore
                  )
              }
          }
          '''
          new = '''@Composable
          private fun HistoryRow(
              item: AppConfigHistoryEntry,
              currentRevision: Int?,
              saving: Boolean,
              onRestore: () -> Unit
          ) {
              val web = LocalRPWebColors.current
              val isCurrent = item.revision == currentRevision
              val canRestore = !saving && !isCurrent

              Row(
                  modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Text(
                      "#${item.revision}",
                      color = web.accentDark,
                      fontSize = 10.5.sp,
                      fontWeight = FontWeight.Bold,
                      modifier = Modifier.width(38.dp)
                  )
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          item.updatedByName ?: "Sistema",
                          color = web.text,
                          fontSize = 10.5.sp,
                          fontWeight = FontWeight.SemiBold,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      Text(formatHistoryDate(item.updatedAt), color = web.muted, fontSize = 9.sp)
                  }

                  Surface(
                      onClick = onRestore,
                      enabled = canRestore,
                      modifier = Modifier.width(86.dp).height(34.dp),
                      shape = RoundedCornerShape(9.dp),
                      color = if (isCurrent) web.accentSoft else web.surface,
                      border = BorderStroke(
                          1.dp,
                          when {
                              isCurrent -> web.accentDark.copy(alpha = .28f)
                              canRestore -> web.accentDark.copy(alpha = .38f)
                              else -> web.borderStrong
                          }
                      )
                  ) {
                      Box(contentAlignment = Alignment.Center) {
                          Text(
                              if (isCurrent) "Ativa" else "Restaurar",
                              color = when {
                                  isCurrent -> web.accentDark
                                  canRestore -> web.accentDark
                                  else -> web.muted.copy(alpha = .45f)
                              },
                              fontSize = 10.5.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }
              }
          }
          '''
          if old not in text:
              raise SystemExit('HistoryRow esperado nao encontrado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validar diff
        run: git diff --check

      - name: Commitar correcao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/java/br/com/rpdoces/admin/ui/appcontrol/AppControlScreen.kt
          git commit -m "fix(android): alinha restauracao no historico do app"
          git push origin HEAD:main
