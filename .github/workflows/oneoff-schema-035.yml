name: One-off schema 035

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-schema-035.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar schema
        run: npm run schema:generate

      - name: Commitar schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schema_full.sql
          if git diff --cached --quiet; then
            echo "Schema já sincronizado."
            exit 0
          fi
          git commit -m "chore(db): sincroniza schema da devolucao parcial"
          git push origin HEAD:main
