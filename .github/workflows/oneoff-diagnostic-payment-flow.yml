name: One-off diagnostic payment flow

on:
  push:
    branches:
      - main
    paths:
      - "scripts/oneoff-diagnostic-payment-flow.py"
      - ".github/workflows/oneoff-diagnostic-payment-flow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: |
          python scripts/oneoff-diagnostic-payment-flow.py
          rm -f tests/diagnostic-payment-flow.test.mjs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Testar backend
        run: |
          npm ci
          npm test

      - name: Testar e compilar Admin
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build

      - name: Verificar schema
        run: |
          npm run schema:generate
          git diff --exit-code -- schema_full.sql

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar APK Android
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Limpar ferramentas temporárias e publicar patch
        run: |
          rm -f scripts/oneoff-diagnostic-payment-flow.py
          rm -f .github/workflows/oneoff-diagnostic-payment-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(orders): exige forma de pagamento em pedido teste"
          git push origin HEAD:main
