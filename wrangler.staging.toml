name = "rp-doces-staging"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = "dist"

[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "rp-doces-push-staging"

[[d1_databases]]
binding = "DB"
database_name = "rp-doces-db-staging"
# Replace in BOTH staging configs after manually creating the staging D1.
database_id = "STAGING_D1_ID_REPLACE_AFTER_CREATE"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "rp-doces-images-staging"
