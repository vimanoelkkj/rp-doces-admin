name = "rp-doces-push-staging"
main = "workers/push.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_als"]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "rp-doces-db-staging"
database_id = "a63daa6e-c268-409a-a143-f23b4c469ca7"
migrations_dir = "migrations"

[[queues.consumers]]
queue = "rp-doces-push-staging"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[triggers]
crons = ["* * * * *"]
