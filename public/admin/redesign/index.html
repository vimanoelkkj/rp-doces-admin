<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    />

    <link rel="stylesheet" href="./assets/css/category-select.css" />
    <link rel="stylesheet" href="./assets/css/product-dialog-compact.css" />
    <link rel="stylesheet" href="./assets/css/product-actions.css" />
    <link rel="stylesheet" href="./assets/css/product-delete.css" />
    <link rel="stylesheet" href="./assets/css/category-manager.css" />
    <link rel="stylesheet" href="./assets/css/category-manager-dynamic.css" />
    <link rel="stylesheet" href="./assets/css/orders.css" />
    <link rel="stylesheet" href="./assets/css/orders-polish.css" />
    <link rel="stylesheet" href="./assets/css/orders-compact.css" />
    <link rel="stylesheet" href="./assets/css/manual-orders.css" />
    <link rel="stylesheet" href="./assets/css/manual-selects.css" />
    <link rel="stylesheet" href="./assets/css/manual-payment-state.css" />
    <link rel="stylesheet" href="./assets/css/admins.css" />
    <link rel="stylesheet" href="./assets/css/admins-summary-compact.css" />
    <link rel="stylesheet" href="./assets/css/admins-password-inline.css" />
    <link rel="stylesheet" href="./assets/css/admins-font-scale.css" />
    <link rel="stylesheet" href="./assets/css/store.css" />
    <link rel="stylesheet" href="./assets/css/time-picker.css" />
    <link rel="stylesheet" href="./assets/css/profile-menu.css" />
    <link rel="stylesheet" href="./assets/css/notifications.css" />
    <link rel="stylesheet" href="./assets/css/responsive-qa.css" />
    <link rel="stylesheet" href="./assets/css/modal-viewport-fix.css" />
    <link rel="stylesheet" href="./assets/css/manual-orders-rescue.css" />
    <link rel="stylesheet" href="./assets/css/sidebar-badges-help.css" />
  </head>
  <body>
    <div class="admin-app" data-admin-app>
      <aside class="admin-sidebar" aria-label="Navegação administrativa">
        <div class="admin-brand">
          <div class="admin-brand__mark" aria-hidden="true">R&P</div>
          <div class="admin-brand__copy">
            <strong>R&P <em>Doces</em></strong>
            <span>Painel administrativo</span>
          </div>
        </div>

        <nav class="admin-nav">
          <button class="admin-nav__item" type="button" data-admin-nav="dashboard" data-label="Dashboard">
            <span class="admin-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></svg></span>
            <span class="admin-nav__label">Dashboard</span>
          </button>
          <button class="admin-nav__item" type="button" data-admin-nav="produtos" data-label="Produtos">
            <span class="admin-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 7 4v10l-7 4-7-4V7l7-4Z" /><path d="m5 7 7 4 7-4M12 11v10" /></svg></span>
            <span class="admin-nav__label">Produtos</span><span class="admin-nav__badge" data-nav-badge="produtos" hidden></span>
          </button>
          <button class="admin-nav__item" type="button" data-admin-nav="pedidos" data-label="Pedidos">
            <span class="admin-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h10l2 3v15H5V6l2-3Z" /><path d="M5 8h14M9 12h6M9 16h4" /></svg></span>
            <span class="admin-nav__label">Pedidos</span><span class="admin-nav__badge" data-nav-badge="pedidos" hidden></span>
          </button>
          <button class="admin-nav__item" type="button" data-admin-nav="admins" data-label="Administradores">
            <span class="admin-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" /><path d="M3.5 19c.8-3.2 2.6-4.8 5.5-4.8s4.7 1.6 5.5 4.8M17 7h4M19 5v4" /></svg></span>
            <span class="admin-nav__label">Administradores</span>
          </button>
          <button class="admin-nav__item" type="button" data-admin-nav="loja" data-label="Loja">
            <span class="admin-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM3 10l2-6h14l2 6" /><path d="M8 14h4v6" /></svg></span>
            <span class="admin-nav__label">Loja</span>
          </button>
        </nav>

        <div class="admin-sidebar__footer">
          <button class="admin-collapse" type="button" data-collapse-sidebar aria-expanded="true">
            <span class="admin-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5" /></svg></span>
            <span>Recolher</span>
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <div class="admin-page-title"><h1 data-page-title>Dashboard</h1><p data-page-subtitle>Visão geral da operação</p></div>
          <div class="admin-topbar__actions">
            <a class="admin-icon" href="/" target="_blank" rel="noopener noreferrer" aria-label="Abrir site público" title="Abrir site público"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8" /><path d="M19 13v6H5V5h6" /></svg></a>
            <button class="admin-icon admin-notifications-button" type="button" data-notifications-button aria-label="Notificações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.4-2V10a4.6 4.6 0 0 0-9.2 0v5L6 17Z" /><path d="M10 20h4" /></svg><span class="admin-notifications-button__dot" data-notifications-dot hidden></span></button>
            <button class="admin-profile" type="button" aria-label="Abrir menu da conta"><span class="admin-avatar" data-profile-avatar aria-hidden="true">RP</span><span class="admin-profile__copy"><strong data-profile-name>Administrador</strong><span data-profile-role>ADMIN</span></span><span class="admin-profile__chevron" aria-hidden="true"></span></button>
          </div>
        </header>
        <div class="admin-content" data-admin-content></div>
      </main>
    </div>

    <script type="module" src="./assets/js/app.js"></script>
    <script type="module" src="./assets/js/stock-stepper.js"></script>
    <script type="module" src="./assets/js/dynamic-product-categories.js"></script>
    <script type="module" src="./assets/js/category-select.js"></script>
    <script type="module" src="./assets/js/product-actions.js"></script>
    <script type="module" src="./assets/js/product-delete.js"></script>
    <script type="module" src="./assets/js/input-masks.js"></script>
    <script type="module" src="./assets/js/category-manager.js"></script>
    <script type="module" src="./assets/js/time-picker.js"></script>
    <script type="module" src="./assets/js/manual-selects.js"></script>
    <script type="module" src="./assets/js/manual-payment-state.js"></script>
  </body>
</html>
