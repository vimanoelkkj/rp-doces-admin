<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1412" />
    <title>R&amp;P Doces Admin - Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #1a1412;
        color: #faf6f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .offline-card {
        background: #241c19;
        border: 1px solid #3d302c;
        border-radius: 20px;
        padding: 40px 24px;
        max-width: 400px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      }
      .offline-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #332622;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d38b80;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        color: #faf6f0;
        line-height: 1.3;
      }
      p {
        font-size: 14px;
        color: #c4a68f;
        line-height: 1.5;
      }
      .retry-btn {
        margin-top: 8px;
        background-color: #d38b80;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
      }
      .retry-btn:hover {
        background-color: #be756a;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="offline-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>Sem conexão com a internet</h1>
      <p>Reconecte para acessar e gerenciar a loja.</p>
      <button class="retry-btn" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
